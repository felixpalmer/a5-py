[project]
name = "pya5"
version = "0.11.0"
description = "A5 - Global Pentagonal Geospatial Index"
readme = "README.md"
# Unchanged from 0.10. The compiled backend is built abi3-py38, so it covers the
# same range the pure-Python implementation always has.
requires-python = ">=3.8"
license = {file = 'LICENSE'}
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Mixed Rust/Python project: the `a5` package lives at the repository root and
# the compiled extension is grafted in as the private submodule `a5._a5`.
python-source = "."
module-name = "a5._a5"
# Development-only trees and build leftovers. maturin walks the working
# directory rather than consulting git, so gitignored paths need listing too.
exclude = [
    "benchmarks/**",
    "examples/**",
    "scripts/**",
    "tests/**",
    ".github/**",
    ".cargo/**",
    ".benchmarks/**",
    ".pytest_cache/**",
    "**/__pycache__/**",
    "*.egg-info/**",
    "dist/**",
    "target/**",
    "wheelhouse/**",
    "main.py",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0"]
bench = ["pytest-benchmark>=4.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
python_functions = ["test_*", "bench_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-benchmark>=4.0.0",
    "maturin>=1.7,<2.0",
]

[tool.cibuildwheel]
# abi3-py38 means a single CPython 3.8 build covers every later 3.x, so only cp38
# is built. The one exception is macOS arm64, where the workflow overrides this
# to cp39 -- see .github/workflows/wheels.yml. PyPy has no abi3 support.
build = "cp38-*"
skip = "pp* *-manylinux_i686 *-musllinux_i686 *-win32"
build-frontend = "build"
test-requires = ["pytest"]
# Run the fixture suite against the installed wheel, once per backend. The
# working directory is not the repository root, so `a5` resolves to the wheel
# rather than the source tree. A5_EXPECT_BACKEND makes the run fail rather than
# fall back, so a wheel whose extension module does not load is caught here.
test-command = [
    "A5_BACKEND=rust A5_EXPECT_BACKEND=rust python -m pytest {project}/tests -q",
    "A5_BACKEND=python A5_EXPECT_BACKEND=python python -m pytest {project}/tests -q",
]

[tool.cibuildwheel.linux]
# manylinux/musllinux containers have no Rust toolchain of their own.
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.windows]
# cmd.exe has no `VAR=value cmd` prefix syntax. No space before `&&` -- cmd would
# include it in the variable's value.
test-command = [
    "set A5_BACKEND=rust&& set A5_EXPECT_BACKEND=rust&& python -m pytest {project}/tests -q",
    "set A5_BACKEND=python&& set A5_EXPECT_BACKEND=python&& python -m pytest {project}/tests -q",
]

# MACOSX_DEPLOYMENT_TARGET is deliberately not set: cibuildwheel already picks a
# correct floor per architecture, and pinning one value globally would conflict
# with arm64, which cannot go below 11.0.
