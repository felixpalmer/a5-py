name: publish

# Publishes pya5 to PyPI when a version tag (vX.Y.Z, vX.Y.ZbN, ...) is pushed.
# Uses PyPI trusted publishing (OIDC) — no API token. Configure the trusted publisher for
# the `pya5` project on PyPI to trust this repo (felixpalmer/a5-py) + workflow (publish.yml).
#
# Local release flow:
#   1. bump "version" in pyproject.toml (e.g. 0.10.1 or 1.0.0b1)
#   2. update CHANGELOG.md
#   3. commit, then `./publish.sh beta` (prerelease, from main) or
#      `./publish.sh prod` (stable, from a *-release branch) — tags v<version>
#      and pushes, which triggers this workflow.
#
# PyPI needs no dist-tag: pip auto-excludes PEP 440 prereleases (1.0.0b1) from default installs.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for PyPI trusted publishing (OIDC)

jobs:
  publish-pypi:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -e ".[test]"

      - name: Run tests
        run: uv run pytest

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
