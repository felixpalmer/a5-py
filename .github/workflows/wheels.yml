name: wheels

# Builds every distribution pya5 ships: a platform wheel per matrix entry, the
# pure-Python wheel and the sdist. Runs on every pull request that touches the
# build, so a broken matrix is caught before a release rather than during one,
# and is called by publish.yml, which uploads the dist-* artifacts to PyPI.
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'pyproject.toml'
      - 'scripts/build_pure_wheel.py'
      - '.github/workflows/wheels.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds both manylinux and musllinux per architecture --
          # musllinux matters for Alpine-based containers, which is most of the
          # slim Docker images people deploy geospatial workers in.
          - name: linux-x86_64
            os: ubuntu-22.04
            archs: x86_64
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            archs: aarch64
          # macos-13 was the last image under that label and has been retired;
          # jobs requesting it queue forever rather than failing.
          - name: macos-x86_64
            os: macos-15-intel
            archs: x86_64
          - name: macos-arm64
            os: macos-14
            archs: arm64
          - name: windows-AMD64
            os: windows-2022
            archs: AMD64

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The Linux wheels build inside manylinux/musllinux containers, which get
      # their own toolchain via `before-all` in pyproject.toml. Every other
      # platform builds on the runner, which ships Rust already.
      - name: Set up Rust target
        if: runner.os == 'macOS'
        run: rustup target add ${{ matrix.archs == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}

      # 2.23+ recognises native aarch64 Linux runners, so the arm64 wheels build
      # without QEMU.
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          # cp38 everywhere except macOS arm64, whose abi3 floor is 3.9: the
          # official CPython 3.8 installers are x86_64-only (arm64 arrived in
          # 3.9.1), so there is no interpreter to build cp38 against there, and
          # no official 3.8 on that platform to miss out.
          CIBW_BUILD: ${{ matrix.archs == 'arm64' && 'cp39-*' || 'cp38-*' }}

      - name: Report wheel sizes
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo '| wheel | size |'
            echo '| --- | ---: |'
            for w in wheelhouse/*.whl; do
              printf '| %s | %s |\n' "$(basename "$w")" "$(du -h "$w" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: wheelhouse/*.whl

  # One abi3 wheel is supposed to serve CPython 3.8 and everything after it.
  # cibuildwheel only ever tests it on the interpreter that built it, so this
  # installs that same wheel on each later minor version and runs the suite.
  abi3-compat:
    needs: build-wheels
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # The two ends of the supported range; test.yml covers the middle.
        python-version: ['3.8', '3.13']

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-x86_64
          path: wheelhouse

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the manylinux wheel
        run: |
          python -m pip install pytest
          python -m pip install --no-index --find-links wheelhouse pya5

      - name: Run tests against the installed wheel
        env:
          A5_BACKEND: rust
          A5_EXPECT_BACKEND: rust
        # Run from a directory where `a5` cannot resolve to the source tree.
        working-directory: /tmp
        run: python -m pytest "$GITHUB_WORKSPACE/tests" -q

  # The py3-none-any wheel pip falls back to where no platform wheel matches
  # (PyPy, platforms outside the matrix above). Those installs get the
  # pure-Python backend, rather than pip building the sdist, which needs Rust.
  pure-wheel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the pure-Python wheel
        run: python scripts/build_pure_wheel.py wheelhouse

      - name: Install the pure-Python wheel
        run: |
          python -m pip install pytest
          python -m pip install --pre --no-index --find-links wheelhouse pya5

      - name: Run tests against the installed wheel
        env:
          A5_EXPECT_BACKEND: python
        # Run from a directory where `a5` cannot resolve to the source tree.
        working-directory: /tmp
        run: python -m pytest "$GITHUB_WORKSPACE/tests" -q

      - uses: actions/upload-artifact@v4
        with:
          name: dist-pure
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the sdist
        run: |
          python -m pip install "maturin>=1.7,<2.0"
          maturin sdist --out wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: wheelhouse/*.tar.gz
