name: test

# On every pull request, but only on push to master
on:
  push:
    branches:
    - master
  pull_request:

permissions:
  contents: read

jobs:
  # The entire fixture suite runs once per backend. Everything the tests import
  # from the `a5` namespace is served by whichever implementation is selected, so
  # the pure-Python port acts as a continuous differential test of the compiled
  # one rather than a parallel mirror we hope stays in sync.
  #
  # A5_EXPECT_BACKEND makes tests/conftest.py fail collection if the active
  # backend is not the one this job means to exercise. Without it a missing or
  # broken extension module would silently fall back and the "rust" job would
  # quietly test pure Python twice.
  test-python:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    permissions:
      checks: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rust backend
            backend: rust
            remove_extension: false
          - name: pure python (forced)
            backend: python
            remove_extension: false
          # Leaves A5_BACKEND unset and deletes the compiled module, so this
          # covers the shipped default and the automatic fallback together.
          - name: pure python (extension absent)
            backend: ''
            remove_extension: true

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install pytest maturin

      # Builds a5/_a5.abi3.so in the source tree and installs the package
      # editable, so `import a5` resolves to the working copy either way.
      - name: Build extension module
        run: uv run --no-sync maturin develop --release

      - name: Remove extension module
        if: matrix.remove_extension
        run: rm -v a5/_a5*.so

      - name: Run tests
        env:
          A5_BACKEND: ${{ matrix.backend }}
          A5_EXPECT_BACKEND: ${{ matrix.backend || 'python' }}
        run: uv run --no-sync pytest
